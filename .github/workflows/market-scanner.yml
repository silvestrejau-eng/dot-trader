name: DOT Trader Paper Engine

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "dados.json"
      - "sinal.json"
      - "docs/**"
      - "v2/market_snapshot.json"
      - "v2/state.json"
      - "v2/dashboard.json"
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write

concurrency:
  group: dot-trader-paper-engine
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate market signal
        run: timeout 90s python market_scanner.py

      - name: Run paper engine
        run: timeout 90s python paper_engine.py

      - name: Run DOT Trader V2 scanner
        run: timeout 90s python v2/v2_scanner.py

      - name: Run DOT Trader V2 engine
        run: timeout 90s python v2/v2_engine.py

      - name: Validate V2 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("v2/dashboard.json").read_text())
          assert d["paper_trading"] is True
          assert d["real_orders"] is False
          assert d["markets_scanned"] > 0
          assert d["strategies"]["HUNTER_X"]["equity"] >= 0
          assert d["strategies"]["HUNTER_EXTREME"]["equity"] >= 0
          print("V2 validation OK:", d["updated_at"], "markets=", d["markets_scanned"])
          PY

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/v2
          cp v2/dashboard.json docs/v2/dashboard.json
          cp v2/v2_config.json docs/v2/v2_config.json
          git stash push -u -m "cycle-output"
          git pull --rebase origin main
          git stash pop
          git add sinal.json dados.json docs/sinal.json docs/paper_state.json docs/paper_state_extreme.json docs/comparativo.json docs/dados.json docs/dados_hunter_x.json docs/dados_extreme.json docs/v2/index.html docs/v2/dashboard.json docs/v2/v2_config.json v2/market_snapshot.json v2/state.json v2/dashboard.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Update DOT Trader V2 cycle"
            git push
          fi
