name: DOT Trader Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate paper signal
        run: python market_scanner.py

      - name: Publish signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sinal.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no sinal."
          else
            git commit -m "Update DOT Trader market signal"
            git push
          fi
