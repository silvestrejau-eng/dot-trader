name: DOT Trader Paper Engine

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "dados.json"
      - "sinal.json"
      - "docs/**"
      - "v2/market_snapshot.json"
      - "v2/state.json"
      - "v2/dashboard.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dot-trader-paper-engine
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate market signal
        run: timeout 90s python market_scanner.py

      - name: Run paper engine
        run: timeout 90s python paper_engine.py

      - name: Run DOT Trader V2 scanner
        run: timeout 90s python v2/v2_scanner.py

      - name: Run DOT Trader V2 engine
        run: timeout 90s python v2/v2_engine.py

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sinal.json dados.json docs/sinal.json docs/paper_state.json docs/paper_state_extreme.json docs/comparativo.json docs/dados.json docs/dados_hunter_x.json docs/dados_extreme.json v2/market_snapshot.json v2/state.json v2/dashboard.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Update DOT Trader paper trading and V2"
            git push
          fi
