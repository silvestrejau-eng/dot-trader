name: DOT Trader Paper Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate market signal
        run: python market_scanner.py

      - name: Run paper engine
        run: python paper_engine.py

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sinal.json dados.json docs/sinal.json docs/paper_state.json docs/dados.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Update DOT Trader paper trading"
            git push
          fi
