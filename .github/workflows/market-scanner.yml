name: DOT Trader Paper Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dot-trader-paper-engine
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run fast paper cycles
        run: |
          for i in 1 2 3 4; do
            echo "=== PAPER CYCLE $i/4 ==="
            timeout 45s python market_scanner.py
            timeout 45s python paper_engine.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sinal.json dados.json docs/sinal.json docs/paper_state.json docs/paper_state_extreme.json docs/comparativo.json docs/dados.json
            if git diff --cached --quiet; then
              echo "Nenhuma alteração."
            else
              git commit -m "Fast paper cycle $i"
              git push
            fi
            if [ "$i" -lt 4 ]; then sleep 15; fi
          done
