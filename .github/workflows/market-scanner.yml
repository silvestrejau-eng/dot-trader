name: DOT Trader Paper Engine

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dot-trader-paper-engine
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run rapid V1 paper cycles
        run: |
          set -e
          for i in 1 2 3 4 5; do
            echo "=== V1 RAPID CYCLE $i/5 ==="
            timeout 45s python market_scanner.py
            timeout 45s python paper_engine.py
            if [ "$i" -lt 5 ]; then sleep 10; fi
          done

      - name: Validate V1 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("docs/dados_hunter_x.json").read_text())
          e=json.loads(Path("docs/dados_extreme.json").read_text())
          assert x["config"]["paper_trading"] is True
          assert e["config"]["paper_trading"] is True
          print("V1 validation OK:", x["updated_at"], "X=", x["summary"]["patrimonio"], "EXT=", e["summary"]["patrimonio"])
          PY

      - name: Publish V1 dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "v1-cycle-output"
          git pull --rebase origin main
          git stash pop
          git add sinal.json dados.json docs/sinal.json docs/paper_state.json docs/paper_state_extreme.json docs/comparativo.json docs/dados.json docs/dados_hunter_x.json docs/dados_extreme.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Update DOT Trader V1 cycle"
            git push
          fi
