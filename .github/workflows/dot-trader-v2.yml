name: DOT Trader V2
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: dot-trader-v2
  cancel-in-progress: false
jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Scan
        run: timeout 60s python v2/v2_scanner.py
      - name: Engine
        run: timeout 60s python v2/v2_engine.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/market_snapshot.json v2/state.json v2/dashboard.json
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "DOT Trader V2 cycle"; git push; fi
