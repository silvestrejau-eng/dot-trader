name: Sync DOT Trader Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync dashboard data
        run: python sync_pages.py

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
          else
            git commit -m "Update DOT Trader dashboard data"
            git push
          fi
