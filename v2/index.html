<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOT Trader V2</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef;padding:16px}h1{margin:0 0 6px}.muted{color:#9aa4bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}.card{background:#151c31;border:1px solid #29334f;border-radius:16px;padding:16px}.big{font-size:28px;font-weight:700}.ok{color:#6ee7a5}.bad{color:#ff7b8a}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29334f;text-align:left}</style></head><body><h1>DOT Trader V2</h1><div class="muted">Paper Trading • atualização automática • sem ordens reais</div><div id="status" class="card" style="margin-top:14px">Carregando...</div><div id="strategies" class="grid"></div><div class="card" style="margin-top:14px"><h2>Oportunidades</h2><table><thead><tr><th>Ativo</th><th>Score</th><th>Sinal</th><th>Preço</th></tr></thead><tbody id="ops"></tbody></table></div><script>
async function load(){try{const r=await fetch("dashboard.json?t="+Date.now(),{cache:"no-store"});const d=await r.json();const age=(Date.now()-Date.parse(d.updated_at))/1000;document.getElementById("status").innerHTML="<b>Motor:</b> <span class='"+(age<600?"ok":"bad")+"'>"+(age<600?"ONLINE":"ATRASADO")+"</span> • Último ciclo: "+new Date(d.updated_at).toLocaleString()+" • Mercados: "+d.markets_scanned;document.getElementById("strategies").innerHTML=Object.entries(d.strategies).map(([n,s])=>"<div class='card'><h2>"+n+"</h2><div class='big'>R$ "+s.equity.toFixed(2)+"</div><div>Retorno: "+s.return_pct.toFixed(2)+"% • P&L: R$ "+s.pnl_net.toFixed(2)+"</div><div>Posições: "+s.positions+" • Operações: "+s.trades+" • Win rate: "+s.win_rate.toFixed(1)+"%</div><div>Drawdown: "+s.drawdown_pct.toFixed(2)+"%</div></div>").join("");document.getElementById("ops").innerHTML=d.opportunities.map(x=>"<tr><td>"+x.symbol+"</td><td>"+x.score+"</td><td>"+x.signal+"</td><td>"+Number(x.price).toFixed(6)+"</td></tr>").join("")}catch(e){document.getElementById("status").innerHTML="<span class='bad'>V2 aguardando dados do primeiro ciclo.</span> O painel foi publicado corretamente; o robô atualizará os dados a cada 5 minutos.} }load();setInterval(load,15000);</script></body></html>
