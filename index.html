<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>DOT Trader • X vs EXTREME</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#eef2f7;font-family:Arial,sans-serif;padding:14px}h1{margin:0;font-size:24px}.sub{color:#8e99a8;font-size:12px;margin:5px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#151a21;border:1px solid #252d38;border-radius:13px;padding:13px;margin-top:10px}.title{font-size:16px;font-weight:800;margin-bottom:10px}.x{border-color:#315b42}.e{border-color:#704044}.label{font-size:10px;color:#8e99a8;text-transform:uppercase}.v{font-size:20px;font-weight:800;margin-top:4px}.s{font-size:12px;color:#9ca7b5;margin-top:4px}.full{grid-column:1/-1}.good{color:#79e39a}.bad{color:#ff8585}.warn{color:#ffd36b}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#18351f;color:#79e39a;font-size:11px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid #252d38;font-size:11px}th{color:#8e99a8}.opp{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.op{background:#10151b;border-radius:9px;padding:9px}.score{font-weight:800;font-size:17px}.event{font-size:15px;font-weight:800}@media(min-width:750px){body{max-width:1100px;margin:auto;padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.opp{grid-template-columns:repeat(4,1fr)}}</style></head><body><h1>DOT Trader — HUNTER X × EXTREME</h1><div class="sub">Duas estratégias independentes • Paper Trading • atualização a cada 15s</div><span class="badge">● PAPER TRADING ATIVO</span><div class="grid" id="strategies"></div><div class="card full"><div class="title">🔥 Oportunidades HUNTER EXTREME</div><div id="opps" class="opp">Carregando radar...</div></div><div class="card full"><div class="title">Último evento</div><div id="event" class="event warn">Carregando...</div><div id="eventInfo" class="s"></div></div><div class="card full"><div class="title">Operações recentes — EXTREME</div><table><thead><tr><th>Ativo</th><th>Entrada</th><th>Saída</th><th>Líquido</th><th>Motivo</th><th>Data</th></tr></thead><tbody id="hist"><tr><td colspan="6">Carregando...</td></tr></tbody></table></div><div class="card full s" id="status">Atualizando...</div><script>const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));const pct=v=>Number(v||0).toFixed(2).replace('.',',')+'%';const dt=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';let last='';function card(label,d,cls){const s=d.summary||{},c=d.config||{},p=d.positions||[];return '<div class="card '+cls+'"><div class="title">'+label+'</div><div class="grid"><div><div class="label">Patrimônio</div><div class="v">'+brl(s.patrimonio)+'</div><div class="s">'+pct(s.retorno_pct)+'</div></div><div><div class="label">Lucro</div><div class="v '+(s.lucro_liquido>=0?'good':'bad')+'">'+brl(s.lucro_liquido)+'</div><div class="s">'+s.operacoes+' operações</div></div><div><div class="label">Win rate</div><div class="v">'+pct(s.win_rate_pct)+'</div></div><div><div class="label">Posições</div><div class="v">'+p.length+' / '+(c.max_positions||0)+'</div><div class="s">score mínimo '+c.score_min+'</div></div></div></div>'}async function load(){try{const [a,b,c]=await Promise.all([fetch('dados_hunter_x.json?t='+Date.now(),{cache:'no-store'}),fetch('dados_extreme.json?t='+Date.now(),{cache:'no-store'}),fetch('comparativo.json?t='+Date.now(),{cache:'no-store'})]);if(!a.ok||!b.ok||!c.ok)throw 0;const x=await a.json(),e=await b.json(),cmp=await c.json();document.getElementById('strategies').innerHTML=card('🟢 HUNTER X',x,'x')+card('🔴 HUNTER EXTREME',e,'e');const ops=cmp.extreme_opportunities||[];document.getElementById('opps').innerHTML=ops.length?ops.map(o=>'<div class="op"><div><b>'+o.symbol+'</b> <span class="s">'+o.market+'</span></div><div class="score '+(o.score>=75?'good':'warn')+'">'+Number(o.score).toFixed(0)+'/100</div><div class="s">'+(o.signal||'HOLD')+' • momentum '+Number(o.momentum_pct||0).toFixed(2)+'%</div><div class="s">'+(o.reason||[]).join(' • ')+'</div></div>').join(''):'Nenhuma oportunidade acima do score EXTREME neste ciclo.';const t=e.trades||[],z=t[t.length-1];if(z){document.getElementById('event').textContent=(z.reason==='ALVO'?'🎯 ALVO EXTREME':z.reason==='STOP'?'🛑 STOP EXTREME':'🔔 EXTREME ENCERRADA')+' — '+z.symbol;document.getElementById('event').className='event '+(z.net>=0?'good':'bad');document.getElementById('eventInfo').textContent=dt(z.closed_at)+' • '+brl(z.net)+' líquido • score '+z.score}else document.getElementById('event').textContent='⏳ EXTREME ainda sem operação encerrada';document.getElementById('hist').innerHTML=t.slice(-12).reverse().map(z=>'<tr><td>'+z.symbol+'</td><td>'+brl(z.entry_price)+'</td><td>'+brl(z.exit_price)+'</td><td class="'+(z.net>=0?'good':'bad')+'">'+brl(z.net)+'</td><td>'+z.reason+'</td><td>'+dt(z.closed_at)+'</td></tr>').join('')||'<tr><td colspan="6">Nenhuma operação encerrada.</td></tr>';document.getElementById('status').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR')+' • X e EXTREME independentes';}catch(err){document.getElementById('status').textContent='Aguardando os primeiros dados separados do robô.'}}load();setInterval(load,15000)</script></body></html>
