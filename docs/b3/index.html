<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>DOT Trader • B3</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#edf4ff;font-family:system-ui,-apple-system,sans-serif;padding:14px}.wrap{max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#8fa2bf;font-size:12px}.badge{padding:7px 10px;border-radius:20px;background:#152640;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#101c2e;border:1px solid #263752;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 8px 25px #0002}.big{font-size:25px;font-weight:800;margin:5px 0}.green{color:#5ee39a}.red{color:#ff6f86}.yellow{color:#ffd166}.quote{display:flex;justify-content:space-between;gap:8px}.chart{height:150px;display:flex;align-items:end;gap:3px;padding:10px 0}.bar{flex:1;background:#4f9cf5;border-radius:3px 3px 0 0;min-width:2px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:8px;border-bottom:1px solid #263752;font-size:12px}th{color:#8fa2bf}.pill{padding:4px 7px;border-radius:8px;background:#162840}.status{margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1 style="margin:4px 0">DOT Trader <span class="muted">B3</span></h1><div class="muted">Painel conectado ao motor DOT • Paper Trading</div></div><div class="badge">● MOTOR ONLINE</div></div><div id="status" class="card">Conectando ao motor...</div><div id="macro" class="grid"></div><div class="card"><h2>📊 Radar B3</h2><div class="scroll"><table><thead><tr><th>Ativo</th><th>Preço</th><th>Momentum</th><th>Stop</th><th>Alvo</th><th>RSI</th><th>Score</th></tr></thead><tbody id="stocks"><tr><td colspan="7">Carregando...</td></tr></tbody></table></div></div><div class="card"><h2>📈 Força relativa</h2><div class="muted">Momentum dos ativos retornados pelo scanner</div><div id="chart" class="chart"></div></div><div class="card"><h2>🎯 Oportunidades DOT</h2><div id="radar" class="grid"></div></div><div class="card"><h2>⚔️ Estratégias</h2><div id="strategy" class="grid"></div></div></div><script>const fmt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),money=n=>'R$ '+fmt(n),cls=n=>Number(n)>=0?'green':'red',dt=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';async function api(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}async function load(){try{const[sig,x,e]=await Promise.all([api('../sinal.json'),api('../dados_hunter_x.json'),api('../dados_extreme.json')]);const a=(sig.candidates||[]).filter(c=>c.market==='B3').sort((p,q)=>Number(q.score)-Number(p.score)),best=a[0];document.getElementById('macro').innerHTML='<div class="card"><div class="muted">MOTOR DOT</div><div class="big green">ONLINE</div><div class="muted">'+dt(sig.updated_at)+'</div></div><div class="card"><div class="muted">ATIVOS B3</div><div class="big">'+a.length+'</div><div class="muted">analisados pelo scanner</div></div><div class="card"><div class="muted">MELHOR SCORE</div><div class="big '+(best&&best.score>=75?'green':'yellow')+'">'+(best?best.score:'—')+'/100</div><div class="muted">'+(best?best.symbol:'—')+'</div></div><div class="card"><div class="muted">MODO</div><div class="big yellow">PAPER</div><div class="muted">ordens reais bloqueadas</div></div>';document.getElementById('stocks').innerHTML=a.slice(0,20).map(c=>'<tr><td><b>'+c.symbol+'</b></td><td>'+money(c.price)+'</td><td class="'+cls(c.momentum_pct)+'">'+fmt(c.momentum_pct)+'%</td><td>'+money(c.stop_price)+'</td><td>'+money(c.target_price)+'</td><td>'+fmt(c.rsi14)+'</td><td><span class="pill">'+c.score+'/100</span></td></tr>').join('')||'<tr><td colspan="7">Nenhum ativo B3.</td></tr>';const mn=Math.min(...a.map(c=>+c.momentum_pct||0),-1),mx=Math.max(...a.map(c=>+c.momentum_pct||0),1),rg=mx-mn;document.getElementById('chart').innerHTML=a.slice(0,20).map(c=>'<div class="bar" title="'+c.symbol+' '+fmt(c.momentum_pct)+'%" style="height:'+Math.max(5,((+c.momentum_pct-mn)/rg)*100)+'%"></div>').join('');document.getElementById('radar').innerHTML=a.slice(0,8).map((c,i)=>'<div class="card"><div class="quote"><b>'+c.symbol+'</b><span class="pill">#'+(i+1)+'</span></div><div class="big '+(c.score>=75?'green':c.score>=65?'yellow':'red')+'">'+c.score+'/100</div><div class="muted">'+c.signal+' • RSI '+fmt(c.rsi14)+'</div><div class="muted">'+(c.reasons||[]).slice(0,2).join(' • ')+'</div></div>').join('')||'<div class="card">Sem oportunidades.</div>';document.getElementById('strategy').innerHTML='<div class="card"><div class="muted">HUNTER X</div><div class="big '+cls(x.summary?.lucro_liquido)+'">'+money(x.summary?.lucro_liquido)+'</div><div class="muted">'+(x.positions||[]).length+' posições • '+(x.trades||[]).length+' encerradas</div></div><div class="card"><div class="muted">HUNTER EXTREME</div><div class="big '+cls(e.summary?.lucro_liquido)+'">'+money(e.summary?.lucro_liquido)+'</div><div class="muted">'+(e.positions||[]).length+' posições • '+(e.trades||[]).length+' encerradas</div></div>';document.getElementById('status').innerHTML='<b>Integração:</b> <span class="green">CONECTADA</span> • último ciclo '+dt(sig.updated_at)+' • leitura do painel a cada 15s'}catch(err){document.getElementById('status').innerHTML='<b class="red">Motor indisponível.</b> Nova tentativa em 15s.'}}load();setInterval(load,15000)</script></body></html>
