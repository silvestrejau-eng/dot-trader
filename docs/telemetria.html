<!doctype html><meta charset='utf-8'><title>DOT Telemetria</title><body style='font-family:system-ui;background:#07101d;color:#fff;padding:20px'><h2>DOT Trader — Telemetria</h2><pre id='x'>Carregando...</pre><script>async function a(){try{let r=await fetch('sinal.json?t='+Date.now(),{cache:'no-store'});let j=await r.json();document.getElementById('x').textContent=JSON.stringify({atualizado:j.updated_at,ciclo_s:j.cycle_duration_seconds,ativos:j.successful_assets,falhas:j.failed_assets,performance:j.performance},null,2)}catch(e){document.getElementById('x').textContent='Erro: '+e}}a();setInterval(a,15000)</script></body>
