<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DOT Trader - Telemetria</title><body style='font-family:system-ui;background:#07101d;color:#fff;padding:20px'><h2>DOT Trader — Telemetria</h2><div id='x'>Carregando...</div><script>async function a(){try{let r=await fetch('../sinal.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();document.getElementById('x').innerHTML='<p><b>Última atualização:</b> '+j.updated_at+'</p><p><b>Ciclo:</b> '+(j.cycle_duration_seconds??'—')+' s</p><p><b>Ativos:</b> '+(j.successful_assets??'—')+'</p><p><b>Falhas:</b> '+(j.failed_assets??'—')+'</p><pre>'+JSON.stringify(j.performance||{},null,2)+'</pre>'}catch(e){document.getElementById('x').textContent='Erro ao ler o motor: '+e}}a();setInterval(a,15000)</script></body></html>
