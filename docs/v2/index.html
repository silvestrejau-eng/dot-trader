<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOT Trader V3</title><style>
:root{--bg:#07101d;--card:#101c2e;--line:#263752;--txt:#edf4ff;--muted:#8fa2bf;--blue:#4f9cf5;--green:#5ee39a;--red:#ff6f86}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:14px}.wrap{max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:7px 10px;border-radius:20px;background:#152640;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 8px 25px #0002}.muted{color:var(--muted);font-size:12px}.big{font-size:25px;font-weight:800;margin:5px 0}.green{color:var(--green)}.red{color:var(--red)}.tabs{overflow:auto;white-space:nowrap;margin:8px 0}.tabs button{background:#14243b;color:#fff;border:1px solid #30435f;padding:10px 13px;border-radius:9px;margin:3px;cursor:pointer}.tabs button.on{background:#28558e}section{display:none}section.on{display:block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#0b1729;border-radius:10px;padding:10px}.chart{height:180px;display:flex;align-items:end;gap:3px;padding:10px 4px}.bar{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-width:2px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.scroll{overflow:auto}.pill{font-size:11px;padding:4px 7px;border-radius:8px;background:#162840}.top{font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split,.metrics{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="head"><div><h1 style="margin:4px 0">DOT Trader <span class="muted">V3</span></h1><div class="muted">Hunter Lab • paper trading • leitura em tempo real</div></div><div class="badge">● PAPER • ORDENS REAIS OFF</div></div><div id="status" class="card">Carregando motor...</div><div id="cards" class="grid"></div><div class="tabs"><button class="on" onclick="tab('geral',this)">Visão geral</button><button onclick="tab('x',this)">HUNTER_X</button><button onclick="tab('e',this)">HUNTER_EXTREME</button><button onclick="tab('o',this)">Oportunidades</button></div><section id="geral" class="on"><div class="split"><div class="card"><h3>Patrimônio por estratégia</h3><div id="compare" class="chart"></div></div><div class="card"><h3>Leitura rápida</h3><div id="summary"></div></div></div></section><section id="x"></section><section id="e"></section><section id="o"><div class="card"><h2>Ranking de oportunidades</h2><div class="scroll" id="ops"></div></div></section></div><script>
const M=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),N=n=>Number(n||0).toFixed(2),C=n=>n>=0?'green':'red';
function tab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');b.classList.add('on')}
function block(name,s){let h=s.equity_history||[],vals=h.map(x=>+x.equity),lo=Math.min(...vals,10000),hi=Math.max(...vals,10000),rg=Math.max(hi-lo,1),bars=h.map(x=>'<div class="bar" title="'+M(x.equity)+'" style="height:'+Math.max(3,(x.equity-lo)/rg*100)+'%"></div>').join('');let p=(s.positions_detail||[]).map(x=>'<tr><td class="top">'+x.symbol+'</td><td>'+N(x.qty)+'</td><td>'+N(x.entry)+'</td><td>'+N(x.mark)+'</td><td class="'+C(x.unrealized_pnl)+'">'+M(x.unrealized_pnl)+'</td><td>'+N(x.stop)+'</td><td>'+N(x.target)+'</td><td>'+x.score+'</td></tr>').join('')||'<tr><td colspan="8">Nenhuma posição aberta</td></tr>';let t=(s.trades_detail||[]).slice().reverse().map(x=>'<tr><td class="top">'+x.symbol+'</td><td>'+N(x.entry)+'</td><td>'+N(x.exit)+'</td><td class="'+C(x.net)+'">'+M(x.net)+'</td><td>'+x.reason+'</td><td>'+new Date(x.closed_at).toLocaleString()+'</td></tr>').join('')||'<tr><td colspan="6">Nenhuma operação encerrada</td></tr>';return '<div class="card"><h2>'+name+' • '+M(s.equity)+'</h2><div class="metrics"><div class="metric"><span class="muted">Retorno</span><br><b class="'+C(s.return_pct)+'">'+N(s.return_pct)+'%</b></div><div class="metric"><span class="muted">P&L aberto</span><br><b class="'+C(s.open_pnl)+'">'+M(s.open_pnl)+'</b></div><div class="metric"><span class="muted">Entradas / saídas</span><br><b>'+s.opened_now+' / '+s.closed_now+'</b></div></div><div class="muted" style="margin-top:12px">Evolução do patrimônio</div><div class="chart">'+bars+'</div></div><div class="card"><h3>Posições abertas</h3><div class="scroll"><table><tr><th>Ativo</th><th>Qtd.</th><th>Entrada</th><th>Atual</th><th>P&L aberto</th><th>Stop</th><th>Alvo</th><th>Score</th></tr>'+p+'</table></div></div><div class="card"><h3>Histórico de operações</h3><div class="scroll"><table><tr><th>Ativo</th><th>Entrada</th><th>Saída</th><th>P&L líquido</th><th>Motivo</th><th>Fechamento</th></tr>'+t+'</table></div></div>'}
async function load(){try{let r=await fetch('dashboard.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),age=(Date.now()-Date.parse(d.updated_at))/1000;document.getElementById('status').innerHTML='<b>Motor:</b> <span class="'+(age<600?'green':'red')+'">'+(age<600?'ONLINE':'ATRASADO')+'</span> • '+new Date(d.updated_at).toLocaleString()+' • '+d.markets_scanned+' mercados analisados';let entries=Object.entries(d.strategies);document.getElementById('cards').innerHTML=entries.map(([n,s])=>'<div class="card"><div class="muted">'+n+'</div><div class="big">'+M(s.equity)+'</div><div class="'+C(s.return_pct)+'">'+N(s.return_pct)+'%</div><div class="muted">'+s.positions+' abertas • '+s.trades+' encerradas • P&L aberto '+M(s.open_pnl)+'</div></div>').join('');let a=d.strategies.HUNTER_X,b=d.strategies.HUNTER_EXTREME;document.getElementById('x').innerHTML=block('HUNTER_X',a);document.getElementById('e').innerHTML=block('HUNTER_EXTREME',b);document.getElementById('compare').innerHTML='<div style="width:50%;text-align:center"><div class="bar" style="height:'+Math.max(8,a.equity/10000*100)+'%"></div><small>HUNTER_X<br>'+M(a.equity)+'</small></div><div style="width:50%;text-align:center"><div class="bar" style="height:'+Math.max(8,b.equity/10000*100)+'%"></div><small>EXTREME<br>'+M(b.equity)+'</small></div>';document.getElementById('summary').innerHTML='<p>Mercados: <b>'+d.markets_scanned+'</b></p><p>HUNTER_X: <b>'+a.opened_now+' entradas</b></p><p>EXTREME: <b>'+b.opened_now+' entradas</b></p><p>Melhor score: <b>'+Math.max(...(d.opportunities||[]).map(x=>x.score))+'</b></p>';document.getElementById('ops').innerHTML='<table><tr><th>Ativo</th><th>Score</th><th>Sinal</th><th>Preço</th><th>RSI</th><th>Momentum</th><th>Volume</th></tr>'+(d.opportunities||[]).map(x=>'<tr><td class="top">'+x.symbol+'</td><td><span class="pill">'+x.score+'</span></td><td>'+x.signal+'</td><td>'+N(x.price)+'</td><td>'+N(x.rsi)+'</td><td>'+N(x.momentum_pct)+'%</td><td>'+N(x.volume_ratio)+'x</td></tr>').join('')+'</table>'}catch(e){document.getElementById('status').innerHTML='<span class="red">Sem dados do motor</span>'}}load();setInterval(load,15000);
</script></body></html>
