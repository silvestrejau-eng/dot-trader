<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.json">
<title>DOT Trader</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c16;color:#eef2ff}
main{max-width:620px;margin:auto;padding:20px 16px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:24px;font-weight:800}.status{font-size:12px;opacity:.7}.price{font-size:42px;font-weight:800;margin:8px 0}
.muted{opacity:.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#11182a;border:1px solid #202b44;border-radius:16px;padding:16px;margin-bottom:10px}
.label{font-size:12px;opacity:.6}.value{font-size:20px;font-weight:700;margin-top:5px}.signal{font-size:24px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:12px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#243354;color:white;font-weight:700;font-size:16px}
.small{font-size:13px}.up{color:#6ee7b7}.down{color:#fca5a5}
</style></head><body><main>
<div class="top"><div class="brand">DOT Trader</div><div class="status">PAPER TRADING</div></div>
<section class="card"><div class="label">DOT / mercado</div><div id="price" class="price">--</div><div id="change" class="muted">Carregando...</div></section>
<div class="grid">
<section class="card"><div class="label">SINAL</div><div id="signal" class="signal">--</div></section>
<section class="card"><div class="label">PATRIMÔNIO</div><div id="equity" class="value">--</div></section>
<section class="card"><div class="label">CAPITAL</div><div id="capital" class="value">--</div></section>
<section class="card"><div class="label">RETORNO</div><div id="return" class="value">--</div></section>
</div>
<section class="card"><div class="row"><span>Stop</span><strong id="stop">--</strong></div><div class="row"><span>Alvo</span><strong id="target">--</strong></div></section>
<section class="card"><div class="label">STATUS</div><div id="msg" class="small">Conectando ao painel...</div></section>
<button class="btn" onclick="location.reload()">Atualizar agora</button>
</main>
<script>
async function atualizar(){
 try{
  const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=DOTUSDT',{cache:'no-store'});const m=await r.json();const d={price:parseFloat(m.lastPrice),change_pct:parseFloat(m.priceChangePercent),signal:parseFloat(m.priceChangePercent)>=0.5?'COMPRA':parseFloat(m.priceChangePercent)<=-0.5?'EVITAR':'AGUARDAR',equity:parseFloat(localStorage.getItem('dot_capital')||'10000'),capital:parseFloat(localStorage.getItem('dot_capital')||'10000'),return_pct:0,stop:0,target:0,message:'Mercado ao vivo • paper trading'};
  document.querySelector('#price').textContent=d.price?d.price.toLocaleString('pt-BR',{minimumFractionDigits:4}):'--';
  document.querySelector('#change').textContent=d.change_pct!=null?(d.change_pct.toFixed(2)+'% nas últimas 24h'):'Sem mercado';
  document.querySelector('#change').className=d.change_pct>=0?'up':'down';
  document.querySelector('#signal').textContent=d.signal||'--';
  document.querySelector('#equity').textContent=d.equity!=null?('R$ '+d.equity.toFixed(2)):'--';
  document.querySelector('#capital').textContent=d.capital!=null?('R$ '+d.capital.toFixed(2)):'--';
  document.querySelector('#return').textContent=d.return_pct!=null?(d.return_pct.toFixed(2)+'%'):'--';
  document.querySelector('#stop').textContent=d.stop?d.stop.toFixed(4):'--';
  document.querySelector('#target').textContent=d.target?d.target.toFixed(4):'--';
  document.querySelector('#msg').textContent=d.message||'OK';
 }catch(e){document.querySelector('#msg').textContent='Não foi possível conectar ao DOT Trader.'}
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js');atualizar();setInterval(atualizar,10000);
</script></body></html>
