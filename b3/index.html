<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B3 DOT — teste</title><style>body{margin:0;background:#071018;color:#eef4f8;font-family:Arial;padding:20px}.box{max-width:520px;margin:auto;background:#101a22;border:1px solid #263945;border-radius:16px;padding:20px}h1{margin-top:0}.price{font-size:42px;font-weight:800;margin:15px 0}.ok{color:#57d98b}.err{color:#ff7676}.muted{color:#8fa0ad}</style><div class="box"><h1>📊 B3 DOT</h1><div class="muted">Teste de conexão com a fonte de cotações</div><div id="status">Consultando PETR4...</div><div id="price" class="price">--</div><div id="change"></div><div id="time" class="muted"></div></div><script>async function load(){try{const r=await fetch('https://brapi.dev/api/v2/stocks/quote?symbols=PETR4',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));const x=j.results?.[0]?.data||j.results?.[0];if(!x?.regularMarketPrice)throw new Error('Resposta sem preço');document.getElementById('status').textContent='● CONEXÃO OK';document.getElementById('status').className='ok';document.getElementById('price').textContent=Number(x.regularMarketPrice).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const c=Number(x.regularMarketChangePercent);document.getElementById('change').textContent=(c>=0?'+':'')+c.toFixed(2).replace('.',',')+'%';document.getElementById('change').className=c>=0?'ok':'err';document.getElementById('time').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR')}catch(e){document.getElementById('status').textContent='● ERRO DE CONEXÃO';document.getElementById('status').className='err';document.getElementById('price').textContent='--';document.getElementById('change').textContent=e.message+' — '+new Date().toLocaleTimeString('pt-BR')}}load();setInterval(load,60000)</script>
